<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Parseur et Envoyeur vers GForm</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* Palette noir/blanc + gris d'arrière-plan, pas de container bordé */
    :root{
      --page-bg: #e6e6e6;
      --header-bg: #d9d9d9;
      --input-bg: #ffffff;
      --black: #000000;
      --max-w: 920px;
      --yapla-orange: #f59e0b;
    }

    html,body{height:100%;margin:0;background:var(--page-bg);color:var(--black);font-family:Arial,Helvetica,sans-serif}
    .centered { 
      max-width: var(--max-w); 
      margin:28px auto;         
      padding:0 12px 28px 12px;   
      box-sizing:border-box; 
    }

    .header-banner{
      background:var(--header-bg);
      padding:16px 18px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:space-between;
      flex-wrap:wrap;
      border-radius:6px;
      box-sizing:border-box;
    }
    .header-left{display:flex;flex-direction:column;gap:6px}
    .header-title{font-size:18px;margin:0;font-weight:900;color:var(--black)}
    .header-actions { display:flex; gap:8px; align-items:center; }
    .header-actions .btn { padding:6px 10px; font-size:13px; font-weight:700; }

    .body{padding:16px 0 0 0;background:transparent}
    label{display:block;font-weight:700;margin:12px 0 6px;color:var(--black);font-size:13px}
    textarea{width:100%;min-height:140px;padding:10px;border-radius:4px;border:1px solid var(--black);font-size:14px;background:var(--input-bg);color:var(--black);box-sizing:border-box}
    .controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}

    .btn{
      padding:8px 12px;
      border-radius:2px;
      border:2px solid var(--black);
      background: var(--input-bg);
      color: var(--black);
      font-weight:700;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:0.5; cursor:not-allowed; }
    .btn-primary{ background: var(--black); color: var(--input-bg); }
    .btn-ghost{ background: var(--input-bg); color: var(--black); }

    .yapla-btn{
      background: var(--yapla-orange);
      color: #fff;
      border-color: #b45309;
    }

    .preview{margin-top:14px;padding:12px;border-radius:6px;border:1px solid var(--black);background:var(--input-bg)}
    .section-title{font-weight:900;padding:8px 0;border-top:1px solid var(--black);margin-top:10px}
    .field{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--black)}
    .field:last-child{border-bottom:none}
    .label{font-weight:700}
    .value{font-weight:700}
    .msg{color:var(--black);font-weight:700;margin-top:8px}
    .success { display:flex;align-items:center;gap:12px;border:1px solid var(--black);padding:12px;border-radius:6px;margin-top:12px;background:var(--input-bg) }
    .success .dot{width:36px;height:36px;border-radius:4px;border:2px solid var(--black);background:var(--input-bg);color:var(--black);display:flex;align-items:center;justify-content:center;font-weight:700}
    .success .text{font-weight:700;color:var(--black)}
    .success-actions{margin-left:auto;display:flex;gap:8px}

    .preview-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    @media(max-width:640px){
      .controls{flex-direction:column;align-items:stretch}
      .header-banner{padding:14px}
      .preview-actions{justify-content:flex-start}
    }
  </style>
</head>
<body>
  <div class="centered">
    <!-- header banner -->
    <div class="header-banner" aria-hidden="false">
      <div class="header-left">
        <div class="header-title">Parseur et Envoyeur vers GForm</div>
      </div>
      <div class="header-actions">
        <a class="btn yapla-btn" href="https://s2.yapla.com/donation/fr/campaign/list" target="_blank" rel="noopener">Ouvrir dons Yapla</a>
      </div>
    </div>

    <!-- body -->
    <div class="body">
      <!-- input paste -->
      <div>
        <label for="raw">1) Coller le texte copié depuis Yapla</label>
        <textarea id="raw" placeholder=""></textarea>
      </div>

      <!-- parser control -->
      <div class="controls" style="margin-top:12px">
        <button id="parseBtn" class="btn btn-ghost" title="Analyser le texte collé">Parser</button>
        <div id="validationMsg" class="msg" style="display:none"></div>
      </div>

      <!-- preview -->
      <div id="previewBox" class="preview" style="display:none" aria-live="polite">
        <div class="section-title">----DON----</div>
        <div id="donFields"></div>

        <div style="height:8px"></div>

        <div class="section-title">----DONATEUR----</div>
        <div id="donateurFields"></div>
      </div>

      <!-- buttons under preview (outside the preview box) -->
      <div id="previewActions" class="preview-actions" style="display:none;">
        <button id="prefillBtn" class="btn btn-ghost" disabled>Ouvrir lien prérempli (Vérifier)</button>
        <button id="submitBtn" class="btn btn-primary" disabled>Soumettre au GForm</button>
      </div>

      <!-- success -->
      <div id="successBox" style="display:none" class="success" role="status" aria-live="polite">
        <div class="dot">✓</div>
        <div class="text">As tu un autre don a parser ?</div>
        <div class="success-actions">
          <button id="anotherBtn" class="btn btn-ghost">Oui</button>
          <button id="finishBtn" class="btn btn-ghost">Fermer l'onglet</button>
        </div>
      </div>

      <!-- SECTION: REÇU FISCAL ANNUEL (RÉCAPITULATIF) -->
      <div class="preview" style="margin-top:32px;">
        <div class="section-title" style="border-top:none;margin-top:0;">---- RÉCAPITULATIF ANNUEL (REÇU ANNUEL) ----</div>
        <div class="controls">
          <div style="flex:1; min-width:200px;">
            <label for="donorSelect">Choisir le donateur :</label>
            <select id="donorSelect" class="btn btn-ghost" style="width:100%; justify-content:space-between; cursor:pointer;">
              <option value="">Chargement des donateurs...</option>
            </select>
          </div>
          <div style="width:140px;">
            <label for="annualYear">Année :</label>
            <select id="annualYear" class="btn btn-ghost" style="width:100%; justify-content:space-between; cursor:pointer;">
              <!-- Les années seront générées automatiquement -->
            </select>
          </div>
        </div>
        <div class="controls" style="margin-top:12px;">
          <button id="generateAnnualBtn" class="btn btn-primary">Générer le récapitulatif annuel</button>
          <button id="generatePdfBtn" class="btn btn-yapla" style="background:var(--black); color:var(--input-bg);">Générer le reçu fiscal (PDF)</button>
        </div>
        <div id="annualOutput" style="margin-top:12px; display:none;"></div>
        <div id="pdfOutput" style="margin-top:8px; display:none; font-weight:700;"></div>
      </div>

    </div>
  </div>

  <!-- Iframe cachée pour intercepter la réponse de Google Forms sans ouvrir d'onglet -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted){ showSuccess(); }"></iframe>

  <!-- Formulaire invisible pour soumettre via l'iframe -->
  <form id="gform" action="https://docs.google.com/forms/d/e/1FAIpQLSfv6vyYEftHlRniaCqX-9_0ARUQmnRGhS_LD9smjoG9Jt4yHw/formResponse" method="POST" target="hidden_iframe" style="display:none;">
    <input type="hidden" name="entry.804774151" id="f_prenom">
    <input type="hidden" name="entry.1947114094" id="f_nom">
    <input type="hidden" name="entry.81735574" id="f_email">
    <input type="hidden" name="entry.1914487624" id="f_adresse">
    <input type="hidden" name="entry.1544391775" id="f_cp">
    <input type="hidden" name="entry.1912325143" id="f_ville">
    <input type="hidden" name="entry.1171780890" id="f_pays">
    <input type="hidden" name="entry.1174142672" id="f_montant">
    <input type="hidden" name="entry.163110140" id="f_date">
    <input type="hidden" name="entry.879040345" id="f_mode" value="Carte bancaire">
  </form>

<script>
/* Configuration */
const formAction = 'https://docs.google.com/forms/d/e/1FAIpQLSfv6vyYEftHlRniaCqX-9_0ARUQmnRGhS_LD9smjoG9Jt4yHw/formResponse';
const mapping = {
  prenom: 'entry.804774151',
  nom: 'entry.1947114094',
  email: 'entry.81735574',
  adresse: 'entry.1914487624',
  code_postal: 'entry.1544391775',
  ville: 'entry.1912325143',
  pays: 'entry.1171780890',
  montant: 'entry.1174142672',
  date_creation: 'entry.163110140',
  mode_paiement: 'entry.879040345'
};

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzd07t2TtQa5QbsqvZI7UZbPAUhjuZ78c_ssQ7N-9bZLv6zw4EYlGUEqZBJWBtyRid3/exec';

const rawEl = document.getElementById('raw');
const parseBtn = document.getElementById('parseBtn');
const prefillBtn = document.getElementById('prefillBtn');
const submitBtn = document.getElementById('submitBtn');
const validationMsg = document.getElementById('validationMsg');
const previewBox = document.getElementById('previewBox');
const previewActions = document.getElementById('previewActions');
const donFields = document.getElementById('donFields');
const donateurFields = document.getElementById('donateurFields');

const successBox = document.getElementById('successBox');
const anotherBtn = document.getElementById('anotherBtn');
const finishBtn = document.getElementById('finishBtn');

const donorSelect = document.getElementById('donorSelect');
const annualYear = document.getElementById('annualYear');
const generateAnnualBtn = document.getElementById('generateAnnualBtn');
const annualOutput = document.getElementById('annualOutput');

const generatePdfBtn = document.getElementById('generatePdfBtn');
const pdfOutput = document.getElementById('pdfOutput');

let isSubmitted = false;

function showMsg(txt){ validationMsg.style.display='block'; validationMsg.textContent = txt; }
function clearMsg(){ validationMsg.style.display='none'; validationMsg.textContent = ''; }

/* Génération automatique des années dans le menu déroulant */
function initYearSelect() {
  const currentYear = new Date().getFullYear();
  annualYear.innerHTML = '';
  for (let y = currentYear; y >= currentYear - 3; y--) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if (y === currentYear) {
      opt.selected = true;
    }
    annualYear.appendChild(opt);
  }
}

/* Utilities */
function normalizeAmount(raw){
  if(!raw) return '';
  let s = String(raw).replace(/\u00A0/g,' ').trim();
  s = s.replace(/\s/g,'');
  s = s.replace(/[^\d,.\-]/g,'');
  if(!s) return '';
  if(s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
  if(s.match(/\.0+$/)) s = s.replace(/\.0+$/,'');
  return s;
}
function parseDateToYYYYMMDD(raw){
  if(!raw) return '';
  raw = String(raw).trim();
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const dmy = raw.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
  if(dmy) return `${dmy[3]}-${dmy[2]}-${dmy[1]}`;
  return '';
}
function isoToDDMMYYYY(iso){
  if(!iso) return '';
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  return `${m[3]}/${m[2]}/${m[1]}`;
}

/* Chargement des donateurs depuis le Google Sheet (triés par ordre alphabétique) */
async function loadDonorsFromSheet() {
  try {
    const response = await fetch(SCRIPT_URL + '?action=donors');
    const donors = await response.json();
    
    // Tri alphabétique sur le Nom (puis le Prénom)
    donors.sort((a, b) => {
      const nomA = (a.nom || '').trim().toUpperCase();
      const nomB = (b.nom || '').trim().toUpperCase();
      if (nomA !== nomB) return nomA.localeCompare(nomB);
      const preA = (a.prenom || '').trim().toUpperCase();
      const preB = (b.prenom || '').trim().toUpperCase();
      return preA.localeCompare(preB);
    });

    donorSelect.innerHTML = '<option value="">-- Sélectionnez un donateur --</option>';
    donors.forEach(d => {
      const key = `${d.nom} ${d.prenom}`.trim().toUpperCase();
      const opt = document.createElement('option');
      opt.value = key;
      // Nom Prénom en haut, email en dessous (représenté clairement sur une ligne de texte)
      const emailText = d.email ? d.email : 'Pas d\'email';
      opt.textContent = `${d.nom} ${d.prenom} — ${emailText}`;
      donorSelect.appendChild(opt);
    });
  } catch (e) {
    donorSelect.innerHTML = '<option value="">Erreur de chargement des donateurs</option>';
  }
}

/* Parsing original de Yapla */
function parseYapla(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const data = {};
  const labels = ['Prénom','Nom','Courriel','Téléphone','Adresse','Ville','Code postal','Pays','Montant','Date de création','Date officielle du don','Don anonyme'];
  for(let i=0;i<lines.length;i++){
    const L = lines[i];
    for(const lab of labels){
      if(L.toLowerCase() === lab.toLowerCase()){
        const val = (lines[i+1] || '').trim();
        if(val){
          const key = lab.toLowerCase().replace(/\s+/g,'_').replace(/é|è|ê/g,'e');
          data[key] = val;
        }
      }
    }
    const email = L.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
    if(email) data.courriel = email[0];
    const montant = L.match(/(\d+[,.]\d{2}\s*€)|(\d+[,.]?\d*\s*€)/);
    if(montant) data.montant = montant[0];
    const cp = L.match(/\b\d{5}\b/);
    if(cp) data.code_postal = cp[0];
    const phone = L.match(/(?:\+?\d[\d .-]{6,}\d)/);
    if(phone) data.telephone = phone[0].replace(/\s+/g,'');
  }
  if((!data.prenom || !data.nom) && lines[0]){
    const first = lines[0].split(/\s+/);
    if(first.length>=2){
      if(!data.prenom) data.prenom = first[0];
      if(!data.nom) data.nom = first.slice(1).join(' ');
    }
  }
  const date_raw = data['date_de_creation'] || data['date_officielle_du_don'] || '';
  const date_iso = parseDateToYYYYMMDD(date_raw) || '';
  const date_display = isoToDDMMYYYY(date_iso);
  return {
    prenom: data.prenom || '',
    nom: data.nom || '',
    email: data.courriel || '',
    adresse: data.adresse || '',
    ville: data.ville || '',
    code_postal: data.code_postal || '',
    pays: data.pays || '',
    montant: normalizeAmount(data.montant || ''),
    date_iso: date_iso,
    date_display: date_display
  };
}

/* Render preview */
function renderPreview(parsed){
  donFields.innerHTML = '';
  donateurFields.innerHTML = '';

  const donEntries = [
    ['MONTANT', parsed.montant || ''],
    ['DATE', parsed.date_display || ''],
    ['MODE DE VERSEMENT', 'Carte bancaire']
  ];
  for(const [label, value] of donEntries){
    const row = document.createElement('div');
    row.className = 'field';
    row.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    donFields.appendChild(row);
  }

  const spacer = document.createElement('div');
  spacer.style.height = '6px';
  donFields.appendChild(spacer);

  const donorEntries = [
    ['NOM', parsed.nom || ''],
    ['PRENOM', parsed.prenom || ''],
    ['ADRESSE', parsed.adresse || ''],
    ['CODE POSTAL', parsed.code_postal || ''],
    ['VILLE', parsed.ville || ''],
    ['PAYS', parsed.pays || ''],
    ['ADRESSE MAIL', parsed.email || '']
  ];
  for(const [label, value] of donorEntries){
    const row = document.createElement('div');
    row.className = 'field';
    row.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    donateurFields.appendChild(row);
  }
}

/* Validation */
function canParse(){
  const raw = rawEl.value.trim();
  if(!raw){ showMsg("Veuillez coller d'abord le texte Yapla."); return false; }
  clearMsg(); return true;
}

let lastParsed = null;

parseBtn.addEventListener('click', () => {
  if(!canParse()) return;
  const txt = rawEl.value;
  const parsed = parseYapla(txt);
  lastParsed = parsed;
  renderPreview(parsed);
  previewBox.style.display = 'block';
  previewActions.style.display = 'flex';
  prefillBtn.disabled = false;
  submitBtn.disabled = false;
  clearMsg();
});

function buildPrefillURL(parsed){
  const params = new URLSearchParams();
  if(parsed.prenom) params.set(mapping.prenom, parsed.prenom);
  if(parsed.nom) params.set(mapping.nom, parsed.nom);
  if(parsed.email) params.set(mapping.email, parsed.email);
  if(parsed.adresse) params.set(mapping.adresse, parsed.adresse);
  if(parsed.code_postal) params.set(mapping.code_postal, parsed.code_postal);
  if(parsed.ville) params.set(mapping.ville, parsed.ville);
  if(parsed.pays) params.set(mapping.pays, parsed.pays);
  if(parsed.montant) params.set(mapping.montant, parsed.montant);
  if(parsed.date_iso) params.set(mapping.date_creation, parsed.date_iso);
  params.set(mapping.mode_paiement, 'Carte bancaire');
  const viewBase = formAction.replace('/formResponse','/viewform');
  return viewBase + '?usp=pp_url&' + params.toString();
}

prefillBtn.addEventListener('click', () => {
  if(!lastParsed){ showMsg('Parser d\'abord avant d\'ouvrir le lien prérempli.'); return; }
  clearMsg();
  const url = buildPrefillURL(lastParsed);
  window.open(url, '_blank');
});

submitBtn.addEventListener('click', () => {
  if(!lastParsed){ showMsg('Parser d\'abord avant de soumettre.'); return; }
  clearMsg();

  submitBtn.disabled = true;
  parseBtn.disabled = true;
  prefillBtn.disabled = true;
  rawEl.disabled = true;

  document.getElementById('f_prenom').value = lastParsed.prenom || '';
  document.getElementById('f_nom').value = lastParsed.nom || '';
  document.getElementById('f_email').value = lastParsed.email || '';
  document.getElementById('f_adresse').value = lastParsed.adresse || '';
  document.getElementById('f_cp').value = lastParsed.code_postal || '';
  document.getElementById('f_ville').value = lastParsed.ville || '';
  document.getElementById('f_pays').value = lastParsed.pays || '';
  document.getElementById('f_montant').value = lastParsed.montant || '';
  document.getElementById('f_date').value = lastParsed.date_iso || '';
  document.getElementById('f_mode').value = 'Carte bancaire';

  isSubmitted = true;
  document.getElementById('gform').submit();
});

function showSuccess() {
  if(isSubmitted) {
    successBox.style.display = 'flex';
    successBox.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

anotherBtn.addEventListener('click', () => {
  rawEl.value = '';
  lastParsed = null;
  isSubmitted = false;
  previewBox.style.display = 'none';
  previewActions.style.display = 'none';
  donFields.innerHTML = '';
  donateurFields.innerHTML = '';
  successBox.style.display = 'none';
  submitBtn.disabled = true;
  prefillBtn.disabled = true;
  parseBtn.disabled = false;
  rawEl.disabled = false;
  clearMsg();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  rawEl.focus();
  loadDonorsFromSheet();
});

finishBtn.addEventListener('click', () => {
  window.close();
  setTimeout(() => {
    successBox.querySelector('.text').textContent = 'Tu peux fermer cet onglet manuellement.';
    anotherBtn.style.display = 'none';
    finishBtn.style.display = 'none';
  }, 300);
});

/* Génération du récapitulatif annuel en interrogeant Google Sheets */
generateAnnualBtn.addEventListener('click', async () => {
  const selectedKey = donorSelect.value;
  const year = annualYear.value;

  if(!selectedKey) {
    alert('Veuillez sélectionner un donateur.');
    return;
  }

  annualOutput.style.display = 'block';
  annualOutput.innerHTML = `<div style="padding:8px;">Recherche en cours dans Google Sheets...</div>`;

  try {
    const url = `${SCRIPT_URL}?action=annual&donor=${encodeURIComponent(selectedKey)}&year=${year}`;
    const response = await fetch(url);
    const data = await response.json();

    if(data.count === 0) {
      annualOutput.innerHTML = `<div style="color:var(--black); padding:8px; border:1px dashed var(--black);">Aucun don trouvé pour ce donateur en ${year}.</div>`;
      return;
    }

    const s = data.sample;
    annualOutput.innerHTML = `
      <div style="border:1px solid var(--black); padding:12px; border-radius:4px; background:var(--input-bg);">
        <div style="font-weight:900; margin-bottom:8px; font-size:14px;">RÉCAPITULATIF ANNUEL DE DONS (${year})</div>
        <div class="field"><div class="label">Donateur :</div><div class="value">${s.nom} ${s.prenom}</div></div>
        <div class="field"><div class="label">Adresse :</div><div class="value">${s.adresse || '-'} ${s.code_postal || ''} ${s.ville || ''}</div></div>
        <div class="field"><div class="label">Nombre total de dons :</div><div class="value">${data.count}</div></div>
        <div class="field"><div class="label">MONTANT TOTAL CUMULÉ :</div><div class="value" style="font-size:15px;">${data.total} €</div></div>
        <div style="margin-top:12px; font-size:12px; font-weight:700;">Ce récapitulatif annuel peut maintenant être édité ou transmis au donateur.</div>
      </div>
    `;
  } catch(e) {
    annualOutput.innerHTML = `<div style="color:var(--black); padding:8px; border:1px dashed var(--black);">Erreur lors de la récupération des données.</div>`;
  }
});

/* Déclenchement de la génération du PDF via Google Apps Script */
generatePdfBtn.addEventListener('click', async () => {
  const selectedKey = donorSelect.value;
  const year = annualYear.value;

  if(!selectedKey) {
    alert('Veuillez sélectionner un donateur.');
    return;
  }

  pdfOutput.style.display = 'block';
  pdfOutput.innerHTML = `<div style="padding:8px;">Génération du reçu fiscal PDF en cours...</div>`;

  try {
    const url = `${SCRIPT_URL}?action=generate_pdf&donor=${encodeURIComponent(selectedKey)}&year=${year}`;
    const response = await fetch(url);
    const data = await response.json();

    if(data.status === "SUCCESS") {
      pdfOutput.innerHTML = `<div style="padding:8px; border:1px solid var(--black); background:var(--input-bg);">Reçu généré avec succès ! <a href="${data.url}" target="_blank" style="font-weight:bold; color:var(--black);">Télécharger le PDF</a></div>`;
    } else {
      pdfOutput.innerHTML = `<div style="padding:8px; border:1px dashed var(--black);">Erreur : ${data.error || 'Impossible de générer le PDF'}</div>`;
    }
  } catch(e) {
    pdfOutput.innerHTML = `<div style="padding:8px; border:1px dashed var(--black);">Erreur réseau lors de la génération du PDF.</div>`;
  }
});

// Initialisations au démarrage de la page
initYearSelect();
loadDonorsFromSheet();
</script>
