<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Parseur et Envoyeur vers GForm</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* Palette noir/blanc + gris d'arrière-plan, pas de container bordé */
    :root{
      --page-bg: #e6e6e6;
      --header-bg: #d9d9d9;
      --input-bg: #ffffff;
      --black: #000000;
      --max-w: 920px;
      --yapla-orange: #f59e0b;
    }

    html,body{height:100%;margin:0;background:var(--page-bg);color:var(--black);font-family:Arial,Helvetica,sans-serif}
    /* Center content but no bordered container
       Ensure same spacing top and bottom: margin-top and margin-bottom equal,
       and add bottom padding so content doesn't touch page bottom on short pages.
    */
    .centered { 
      max-width: var(--max-w); 
      margin:28px auto;           /* top & bottom margin = 28px */
      padding:0 12px 28px 12px;   /* bottom padding matches top margin */
      box-sizing:border-box; 
    }

    .header-banner{
      background:var(--header-bg);
      padding:16px 18px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:space-between;
      flex-wrap:wrap;
      border-radius:6px;
      box-sizing:border-box;
    }
    .header-left{display:flex;flex-direction:column;gap:6px}
    .header-title{font-size:18px;margin:0;font-weight:900;color:var(--black)}
    .header-actions { display:flex; gap:8px; align-items:center; }
    .header-actions .btn { padding:6px 10px; font-size:13px; font-weight:700; }

    .body{padding:16px 0 0 0;background:transparent}
    label{display:block;font-weight:700;margin:12px 0 6px;color:var(--black);font-size:13px}
    textarea{width:100%;min-height:140px;padding:10px;border-radius:4px;border:1px solid var(--black);font-size:14px;background:var(--input-bg);color:var(--black);box-sizing:border-box}
    select,input{padding:8px 10px;border-radius:4px;border:1px solid var(--black);font-size:14px;background:var(--input-bg);color:var(--black)}
    .controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}

    .btn{
      padding:8px 12px;
      border-radius:2px;
      border:2px solid var(--black);
      background: var(--input-bg);
      color: var(--black);
      font-weight:700;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:0.5; cursor:not-allowed; }
    .btn-primary{ background: var(--black); color: var(--input-bg); }
    .btn-ghost{ background: var(--input-bg); color: var(--black); }

    .yapla-btn{
      background: var(--yapla-orange);
      color: #fff;
      border-color: #b45309;
    }

    .preview{margin-top:14px;padding:12px;border-radius:6px;border:1px solid var(--black);background:var(--input-bg)}
    .section-title{font-weight:900;padding:8px 0;border-top:1px solid var(--black);margin-top:10px}
    .field{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--black)}
    .field:last-child{border-bottom:none}
    .label{font-weight:700}
    .value{font-weight:700}
    .msg{color:var(--black);font-weight:700;margin-top:8px}
    .success { display:flex;align-items:center;gap:12px;border:1px solid var(--black);padding:12px;border-radius:6px;margin-top:12px;background:var(--input-bg) }
    .success .dot{width:36px;height:36px;border-radius:4px;border:2px solid var(--black);background:var(--input-bg);color:var(--black);display:flex;align-items:center;justify-content:center;font-weight:700}
    .success .text{font-weight:700;color:var(--black)}
    .success-actions{margin-left:auto;display:flex;gap:8px}

    .preview-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    @media(max-width:640px){
      .controls{flex-direction:column;align-items:stretch}
      .header-banner{padding:14px}
      .preview-actions{justify-content:flex-start}
    }
  </style>
</head>
<body>
  <div class="centered">
    <!-- header banner -->
    <div class="header-banner" aria-hidden="false">
      <div class="header-left">
        <div class="header-title">Parseur et Envoyeur vers GForm</div>
      </div>
      <div class="header-actions">
        <a class="btn yapla-btn" href="https://s2.yapla.com/donation/fr/campaign/list" target="_blank" rel="noopener">Ouvrir dons Yapla</a>
      </div>
    </div>

    <!-- body -->
    <div class="body">
      <!-- input paste -->
      <div>
        <label for="raw">1) Coller le texte copié depuis Yapla</label>
        <textarea id="raw" placeholder=""></textarea>
      </div>

      <!-- mode -->
      <div style="margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div style="min-width:220px">
          <label for="modeSelect">2) Mode de versement (obligatoire)</label>
          <select id="modeSelect" aria-label="Mode de versement">
            <option value="">— choisir —</option>
            <option>Carte bancaire</option>
            <option>Virement bancaire</option>
            <option>Chèque bancaire</option>
            <option>Espèce</option>
          </select>
        </div>
      </div>

      <!-- parser control -->
      <div class="controls" style="margin-top:12px">
        <button id="parseBtn" class="btn btn-ghost" title="Analyser le texte collé">Parser</button>
        <div id="validationMsg" class="msg" style="display:none"></div>
      </div>

      <!-- preview -->
      <div id="previewBox" class="preview" style="display:none" aria-live="polite">
        <div class="section-title">----DON----</div>
        <div id="donFields"></div>

        <div style="height:8px"></div>

        <div class="section-title">----DONATEUR----</div>
        <div id="donateurFields"></div>
      </div>

      <!-- buttons under preview (outside the preview box) -->
      <div id="previewActions" class="preview-actions" style="display:none;">
        <button id="prefillBtn" class="btn btn-ghost" disabled>Ouvrir lien prérempli (Vérifier)</button>
        <button id="submitBtn" class="btn btn-primary" disabled>Soumettre au GForm</button>
      </div>

      <!-- success -->
      <div id="successBox" style="display:none" class="success" role="status" aria-live="polite">
        <div class="dot">✓</div>
        <div class="text">Réponse envoyée — succès.</div>
        <div class="success-actions">
          <button id="anotherBtn" class="btn btn-ghost">Oui, j'en ai un autre</button>
          <button id="finishBtn" class="btn btn-ghost">Non, terminer</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* Configuration */
const formAction = 'https://docs.google.com/forms/d/e/1FAIpQLSfv6vyYEftHlRniaCqX-9_0ARUQmnRGhS_LD9smjoG9Jt4yHw/formResponse';
const mapping = {
  prenom: 'entry.804774151',
  nom: 'entry.1947114094',
  email: 'entry.81735574',
  adresse: 'entry.1914487624',
  code_postal: 'entry.1544391775',
  ville: 'entry.1912325143',
  pays: 'entry.1171780890',
  montant: 'entry.1174142672',
  date_creation: 'entry.163110140',
  mode_paiement: 'entry.879040345'
};

const rawEl = document.getElementById('raw');
const modeEl = document.getElementById('modeSelect');
const parseBtn = document.getElementById('parseBtn');
const prefillBtn = document.getElementById('prefillBtn');
const submitBtn = document.getElementById('submitBtn');
const validationMsg = document.getElementById('validationMsg');
const previewBox = document.getElementById('previewBox');
const previewActions = document.getElementById('previewActions');
const donFields = document.getElementById('donFields');
const donateurFields = document.getElementById('donateurFields');

const successBox = document.getElementById('successBox');
const anotherBtn = document.getElementById('anotherBtn');
const finishBtn = document.getElementById('finishBtn');

function showMsg(txt){ validationMsg.style.display='block'; validationMsg.textContent = txt; }
function clearMsg(){ validationMsg.style.display='none'; validationMsg.textContent = ''; }

/* Utilities */
function normalizeAmount(raw){
  if(!raw) return '';
  let s = String(raw).replace(/\u00A0/g,' ').trim();
  s = s.replace(/\s/g,'');
  s = s.replace(/[^\d,.\-]/g,'');
  if(!s) return '';
  if(s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
  if(s.match(/\.0+$/)) s = s.replace(/\.0+$/,'');
  return s;
}
function parseDateToYYYYMMDD(raw){
  if(!raw) return '';
  raw = String(raw).trim();
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const dmy = raw.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
  if(dmy) return `${dmy[3]}-${dmy[2]}-${dmy[1]}`;
  return '';
}
function isoToDDMMYYYY(iso){
  if(!iso) return '';
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  return `${m[3]}/${m[2]}/${m[1]}`;
}

/* Parsing */
function parseYapla(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const data = {};
  const labels = ['Prénom','Nom','Courriel','Téléphone','Adresse','Ville','Code postal','Pays','Montant','Date de création','Date officielle du don','Don anonyme'];
  for(let i=0;i<lines.length;i++){
    const L = lines[i];
    for(const lab of labels){
      if(L.toLowerCase() === lab.toLowerCase()){
        const val = (lines[i+1] || '').trim();
        if(val){
          const key = lab.toLowerCase().replace(/\s+/g,'_').replace(/é|è|ê/g,'e');
          data[key] = val;
        }
      }
    }
    const email = L.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
    if(email) data.courriel = email[0];
    const montant = L.match(/(\d+[,.]\d{2}\s*€)|(\d+[,.]?\d*\s*€)/);
    if(montant) data.montant = montant[0];
    const cp = L.match(/\b\d{5}\b/);
    if(cp) data.code_postal = cp[0];
    const phone = L.match(/(?:\+?\d[\d .-]{6,}\d)/);
    if(phone) data.telephone = phone[0].replace(/\s+/g,'');
  }
  if((!data.prenom || !data.nom) && lines[0]){
    const first = lines[0].split(/\s+/);
    if(first.length>=2){
      if(!data.prenom) data.prenom = first[0];
      if(!data.nom) data.nom = first.slice(1).join(' ');
    }
  }
  const date_raw = data['date_de_creation'] || data['date_officielle_du_don'] || '';
  const date_iso = parseDateToYYYYMMDD(date_raw) || '';
  const date_display = isoToDDMMYYYY(date_iso);
  return {
    prenom: data.prenom || '',
    nom: data.nom || '',
    email: data.courriel || '',
    adresse: data.adresse || '',
    ville: data.ville || '',
    code_postal: data.code_postal || '',
    pays: data.pays || '',
    montant: normalizeAmount(data.montant || ''),
    date_iso: date_iso,
    date_display: date_display
  };
}

/* Render preview in requested order */
function renderPreview(parsed, modeValue){
  donFields.innerHTML = '';
  donateurFields.innerHTML = '';

  const donEntries = [
    ['MONTANT', parsed.montant || ''],
    ['DATE', parsed.date_display || ''],
    ['MODE DE VERSEMENT', modeValue || '']
  ];
  for(const [label, value] of donEntries){
    const row = document.createElement('div');
    row.className = 'field';
    row.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    donFields.appendChild(row);
  }

  // small spacer
  const spacer = document.createElement('div');
  spacer.style.height = '6px';
  donFields.appendChild(spacer);

  const donorEntries = [
    ['NOM', parsed.nom || ''],
    ['PRENOM', parsed.prenom || ''],
    ['ADRESSE', parsed.adresse || ''],
    ['CODE POSTAL', parsed.code_postal || ''],
    ['VILLE', parsed.ville || ''],
    ['PAYS', parsed.pays || ''],
    ['ADRESSE MAIL', parsed.email || '']
  ];
  for(const [label, value] of donorEntries){
    const row = document.createElement('div');
    row.className = 'field';
    row.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    donateurFields.appendChild(row);
  }
}

/* Validation */
function canParse(){
  const raw = rawEl.value.trim();
  const mode = modeEl.value.trim();
  if(!raw){ showMsg("Veuillez coller d'abord le texte Yapla."); return false; }
  if(!mode){ showMsg("Veuillez choisir le mode de versement avant de parser."); return false; }
  clearMsg(); return true;
}

/* State */
let lastParsed = null;

/* Handlers */
parseBtn.addEventListener('click', () => {
  if(!canParse()) return;
  const txt = rawEl.value;
  const parsed = parseYapla(txt);
  lastParsed = parsed;
  renderPreview(parsed, modeEl.value);
  previewBox.style.display = 'block';
  previewActions.style.display = 'flex';
  prefillBtn.disabled = false;
  submitBtn.disabled = false;
  clearMsg();
});

/* Build prefill URL (uses date_iso for sending) */
function buildPrefillURL(parsed){
  const params = new URLSearchParams();
  if(parsed.prenom) params.set(mapping.prenom, parsed.prenom);
  if(parsed.nom) params.set(mapping.nom, parsed.nom);
  if(parsed.email) params.set(mapping.email, parsed.email);
  if(parsed.adresse) params.set(mapping.adresse, parsed.adresse);
  if(parsed.code_postal) params.set(mapping.code_postal, parsed.code_postal);
  if(parsed.ville) params.set(mapping.ville, parsed.ville);
  if(parsed.pays) params.set(mapping.pays, parsed.pays);
  if(parsed.montant) params.set(mapping.montant, parsed.montant);
  if(parsed.date_iso) params.set(mapping.date_creation, parsed.date_iso);
  if(modeEl.value) params.set(mapping.mode_paiement, modeEl.value);
  const viewBase = formAction.replace('/formResponse','/viewform');
  return viewBase + '?usp=pp_url&' + params.toString();
}

/* Prefill */
prefillBtn.addEventListener('click', () => {
  if(!lastParsed){ showMsg('Parser d\'abord avant d\'ouvrir le lien prérempli.'); return; }
  clearMsg();
  const url = buildPrefillURL(lastParsed);
  window.open(url, '_blank');
});

/* Submit invisible en arrière-plan basé sur l'URL pré-rempli */
submitBtn.addEventListener('click', () => {
  if(!lastParsed){ showMsg('Parser d\'abord avant de soumettre.'); return; }
  clearMsg();

  submitBtn.disabled = true;
  parseBtn.disabled = true;
  prefillBtn.disabled = true;
  rawEl.disabled = true;
  modeEl.disabled = true;

  // On récupère exactement l'URL pré-rempli qui fonctionne bien
  const prefillUrl = buildPrefillURL(lastParsed);
  
  // On transforme l'URL de vue (/viewform) en URL de soumission (/formResponse)
  const submitUrl = prefillUrl.replace('/viewform', '/formResponse');

  // Envoi invisible via fetch
  fetch(submitUrl, {
    method: 'GET',
    mode: 'no-cors'
  }).then(() => {
    successBox.style.display = 'flex';
  }).catch(() => {
    showMsg("Erreur lors de l'envoi.");
    submitBtn.disabled = false;
    parseBtn.disabled = false;
    prefillBtn.disabled = false;
    rawEl.disabled = false;
    modeEl.disabled = false;
  });
});

/* After success: user chooses whether they have another to do */
anotherBtn.addEventListener('click', () => {
  rawEl.value = '';
  modeEl.value = '';
  lastParsed = null;
  previewBox.style.display = 'none';
  previewActions.style.display = 'none';
  donFields.innerHTML = '';
  donateurFields.innerHTML = '';
  successBox.style.display = 'none';
  submitBtn.disabled = true;
  prefillBtn.disabled = true;
  parseBtn.disabled = false;
  rawEl.disabled = false;
  modeEl.disabled = false;
  clearMsg();
  rawEl.focus();
});

finishBtn.addEventListener('click', () => {
  successBox.querySelector('.text').textContent = 'Terminé — tu peux fermer cet onglet.';
  anotherBtn.disabled = true;
  finishBtn.disabled = true;
});
</script>
</body>
</html>
