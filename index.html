<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Parseur et Envoyeur vers GForm</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --page-bg:#e6e6e6; --header-bg:#d9d9d9; --input-bg:#fff; --black:#000;
      --yapla-orange:#f59e0b; --badge-don:#16a34a; --badge-recap:#2563eb;
      --max-w:920px;
    }
    html,body{height:100%;margin:0;background:var(--page-bg);font-family:Arial,Helvetica,sans-serif;color:var(--black)}
    .centered{max-width:var(--max-w);margin:28px auto;padding:0 12px 28px 12px;box-sizing:border-box}
    .header-banner{background:var(--header-bg);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:6px}
    .header-title{font-weight:900;font-size:18px}
    .header-actions{display:flex;gap:8px;align-items:center}
    .btn{padding:8px 12px;border-radius:4px;border:2px solid var(--black);background:var(--input-bg);font-weight:700;cursor:pointer}
    .btn-primary{background:var(--black);color:var(--input-bg)}
    .btn-ghost{background:var(--input-bg)}
    .yapla-btn{background:var(--yapla-orange);color:#fff;border-color:#b45309}
    .preview{margin-top:14px;padding:12px;border-radius:6px;border:1px solid var(--black);background:var(--input-bg)}
    label{display:block;font-weight:700;margin-top:12px}
    textarea{width:100%;min-height:140px;padding:10px;border-radius:4px;border:1px solid var(--black);box-sizing:border-box}
    .section-title{font-weight:900;margin-top:10px;border-top:1px solid var(--black);padding-top:8px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;box-sizing:border-box}
    .modal-box{background:var(--input-bg);border:2px solid var(--black);border-radius:6px;padding:14px;width:100%;max-width:980px;box-sizing:border-box}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
    th{background:#fafafa;font-weight:700}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;color:#fff;font-weight:700;font-size:12px}
    .badge-don{background:var(--badge-don)}
    .badge-recap{background:var(--badge-recap)}
    .empty{padding:16px;text-align:center;color:#666}
    @media(max-width:640px){ .modal-box{max-width:95%} }
  </style>
</head>
<body>
  <div class="centered">
    <div class="header-banner">
      <div class="header-left">
        <div class="header-title">Parseur et Envoyeur vers GForm</div>
      </div>
      <div class="header-actions">
        <button id="openYaplaBtn" class="btn yapla-btn">Ouvrir dons Yapla</button>
        <button id="toggleViewBtn" class="btn btn-ghost"><span id="toggleViewLabel">Récapitulatif annuel</span></button>
      </div>
    </div>

    <div class="body">
      <div id="parserSection" class="preview">
        <div class="section-title" style="border-top:none;margin-top:0">PARSER UN DON</div>
        <label for="raw">Coller le texte copié depuis Yapla</label>
        <textarea id="raw" placeholder="Collez ici les informations du donateur et du don Yapla..."></textarea>
        <div style="margin-top:12px">
          <button id="parseBtn" class="btn btn-primary">Parser</button>
          <button id="prefillBtn" class="btn btn-ghost" disabled>Ouvrir lien prérempli</button>
          <button id="submitBtn" class="btn btn-primary" disabled>Soumettre au GForm</button>
        </div>

        <div style="margin-top:12px;text-align:center">
          <a id="queueStatusLinkParser" href="#" style="font-size:12px;color:#666;text-decoration:underline">Voir les dons en attente (hors 8h-18h)</a>
        </div>
      </div>

      <div id="annualSection" class="preview" style="display:none">
        <div class="section-title" style="border-top:none;margin-top:0">RÉCAPITULATIF ANNUEL (REÇU ANNUEL)</div>
        <label for="donorSelect">Choisir le donateur :</label>
        <select id="donorSelect"></select>
        <label for="annualYear">Année :</label>
        <select id="annualYear"></select>
        <div style="margin-top:12px">
          <button id="generateAnnualBtn" class="btn btn-primary">Générer le récapitulatif</button>
          <button id="generatePdfBtn" class="btn btn-primary" disabled>Générer & Envoyer le Reçu Fiscal Annuel (PDF)</button>
        </div>

        <div style="margin-top:12px;text-align:center">
          <a id="queueStatusLink" href="#" style="font-size:12px;color:#666;text-decoration:underline">Voir les dons en attente (hors 8h-18h)</a>
        </div>
      </div>
    </div>
  </div>

<script>
/* === CONFIG === */
/* METS ICI L'URL DE TON DEPLOIEMENT WEB APPSCRIPT */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzd07t2TtQa5QbsqvZI7UZbPAUhjuZ78c_ssQ7N-9bZLv6zw4EYlGUEqZBJWBtyRid3/exec";
const API_TOKEN = "b1a5caaf329bef0a5698361de58df201";

/* Elements */
const openYaplaBtn = document.getElementById("openYaplaBtn");
const toggleViewBtn = document.getElementById("toggleViewBtn");
const toggleViewLabel = document.getElementById("toggleViewLabel");
const parserSection = document.getElementById("parserSection");
const annualSection = document.getElementById("annualSection");

const queueStatusLink = document.getElementById("queueStatusLink");
const queueStatusLinkParser = document.getElementById("queueStatusLinkParser");

/* keep yapla button as before */
const YAPLA_URL = "https://s2.yapla.com/donation/fr/campaign/list";
let yaplaWindow = null;
openYaplaBtn.addEventListener("click", () => { yaplaWindow = window.open(YAPLA_URL, "_blank"); });

/* --- minimal parsing / other logic (you already have this in your page). 
   For brevity I only include the queue-related parts here (modal + actions). */

/* helper to escape html in inserted strings */
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Fetch the queue (JSON) from server */
async function fetchQueueJson(){
  const url = `${SCRIPT_URL}?action=queue_json&token=${encodeURIComponent(API_TOKEN)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Erreur réseau");
  return res.json();
}

/* Force-send an item (POST) */
async function postForceSend(id){
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: new URLSearchParams({ action: "force_send", id: id, token: API_TOKEN })
  });
  return res.json();
}

/* Build modal listing queue items and attach per-item force-send button */
function buildQueueModal(items){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  const box = document.createElement("div");
  box.className = "modal-box";
  overlay.appendChild(box);

  const title = document.createElement("h3");
  title.textContent = "Éléments en attente";
  box.appendChild(title);

  // summary counts
  const total = items.length;
  const donations = items.filter(i=>i.type==="don").length;
  const recaps = items.filter(i=>i.type==="recu_pdf").length;
  const summary = document.createElement("div");
  summary.style.fontWeight = "700";
  summary.style.marginBottom = "8px";
  summary.textContent = `Total ${total} — Dons: ${donations} — Récaps: ${recaps}`;
  box.appendChild(summary);

  if (!items || items.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Aucun élément en attente.";
    box.appendChild(empty);
    return overlay;
  }

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  thead.innerHTML = "<tr><th>Type</th><th>Donateur / Détails</th><th>Email</th><th>Montant / Nb</th><th>Prévu le</th><th>Action</th></tr>";
  table.appendChild(thead);
  const tbody = document.createElement("tbody");

  items.forEach(item=>{
    const tr = document.createElement("tr");
    const typeLabel = item.type === "recu_pdf" ? "Reçu annuel" : "Don";
    const badgeClass = item.type==="recu_pdf" ? "badge-recap" : "badge-don";
    const details = item.type==="recu_pdf" ? `${item.donor||""} (${item.year||""})` : (item.fields ? `${item.fields.prenom||""} ${item.fields.nom||""}` : "");
    const email = item.type==="recu_pdf" ? (item.email||"-") : ((item.fields && item.fields.email) || "-");
    const montant = item.type==="recu_pdf" ? "-" : ((item.fields && item.fields.montant) || "-");
    let when = "-";
    try { when = new Date(item.sendAfter).toLocaleString("fr-FR", { timeZone: "Europe/Paris", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" }); } catch(e){}

    tr.innerHTML = `<td><span class="badge ${badgeClass}">${escapeHtml(typeLabel)}</span></td>
                    <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(details)}</td>
                    <td>${escapeHtml(email)}</td>
                    <td>${escapeHtml(String(montant))}</td>
                    <td>${escapeHtml(when)}</td>
                    <td style="text-align:right"></td>`;

    const actionCell = tr.querySelector("td:last-child");
    const btn = document.createElement("button");
    btn.className = "btn btn-primary";
    btn.textContent = "Envoyer maintenant";
    btn.addEventListener("click", async () => {
      if (!confirm("Envoyer maintenant cet élément ?")) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = "...";
      try {
        const data = await postForceSend(item.id);
        if (data.error) {
          alert("Erreur : " + data.error);
          btn.disabled = false;
          btn.textContent = original;
          return;
        }
        // remove row on success
        tr.parentNode.removeChild(tr);
      } catch (e) {
        alert("Erreur réseau lors de l'envoi.");
        btn.disabled = false;
        btn.textContent = original;
      }
    });
    actionCell.appendChild(btn);

    if (item.lastError) {
      const errDiv = document.createElement("div");
      errDiv.style.color = "#a00";
      errDiv.style.fontSize = "12px";
      errDiv.textContent = "Erreur précédente : " + item.lastError;
      tr.querySelector("td:nth-child(2)").appendChild(errDiv);
    }

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  box.appendChild(table);

  return overlay;
}

/* Show modal: fetch queue then build modal */
async function showQueueModal(){
  const loading = document.createElement("div");
  loading.className = "modal-overlay";
  const loadingBox = document.createElement("div"); loadingBox.className = "modal-box";
  loadingBox.innerHTML = `<div style="font-weight:700;padding:12px">Chargement de la file d'attente...</div>`;
  loading.appendChild(loadingBox);
  document.body.appendChild(loading);

  try {
    const items = await fetchQueueJson();
    document.body.removeChild(loading);
    const modal = buildQueueModal(items);
    document.body.appendChild(modal);
  } catch (e) {
    document.body.removeChild(loading);
    alert("Erreur lors de la récupération de la file : " + (e.message || e));
  }
}

/* Attach link handlers (prevent navigation) */
if (queueStatusLink) { queueStatusLink.addEventListener("click", e=>{ e.preventDefault(); showQueueModal(); }); }
if (queueStatusLinkParser) { queueStatusLinkParser.addEventListener("click", e=>{ e.preventDefault(); showQueueModal(); }); }

/* Toggle between parser and annual views */
let showingAnnual = false;
toggleViewBtn.addEventListener("click", ()=> {
  showingAnnual = !showingAnnual;
  parserSection.style.display = showingAnnual ? "none" : "block";
  annualSection.style.display = showingAnnual ? "block" : "none";
  toggleViewLabel.textContent = showingAnnual ? "Parser un don" : "Récapitulatif annuel";
});

/* update the link text with a count (calls queue_count) */
async function refreshQueueCount(){
  try {
    const res = await fetch(`${SCRIPT_URL}?action=queue_count&token=${encodeURIComponent(API_TOKEN)}`);
    const data = await res.json();
    const total = data.count || 0;
    const txt = `Voir les dons en attente (hors 8h-18h)${total>0?(" ("+total+")"):""}`;
    if (queueStatusLink) queueStatusLink.textContent = txt;
    if (queueStatusLinkParser) queueStatusLinkParser.textContent = txt;
  } catch(e){ /* silent */ }
}
refreshQueueCount();

/* Note: ton code de parsing, prefill, submit, annual generation, etc. doit être
   inséré ici ou conservé comme auparavant ; j'ai fourni et stabilisé la logique
   de la modal + force send. */
</script>
</body>
</html>
