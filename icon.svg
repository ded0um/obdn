<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour la bordure fine en Noir OBDN -->
    <linearGradient id="orange-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="100%" stop-color="#d9d9d9"/>
    </linearGradient>

    <!-- Dégradé pour le fond intérieur clair (#d9d9d9 / #e6e6e6) -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Ombre interne pour l'effet de profondeur -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.25" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Anneau extérieur Orange OBDN (Bordure fine) -->
  <circle cx="256" cy="256" r="248" fill="url(#orange-border)"/>

  <!-- Fond intérieur clair -->
  <circle cx="256" cy="256" r="238" fill="url(#bg-gradient)" filter="url(#inner-shadow)"/>

  <!-- Texte OBDN en haut -->
  <text x="256" y="110" 
        text-anchor="middle" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="75" 
        letter-spacing="4" 
        fill="#333333">OBDN</text>
<text x="256" y="180" 
        text-anchor="middle" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="75" 
        letter-spacing="4" 
        fill="#333333">PARSEUR</text>
<text x="256" y="250" 
        text-anchor="middle" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="75" 
        letter-spacing="4" 
        fill="#333333">DONS</text>




















  <!-- Illustration centrale : Parseur de données (flux brut vers structuré / code / extraction) -->
  <g transform="translate(146, 275)">
    <!-- Bloc de gauche : Données brutes (Fichier texte / Code) -->
    <rect x="0" y="10" width="65" height="85" rx="8" fill="#ffffff" stroke="#f09a27" stroke-width="4"/>
    <!-- Lignes de texte brut à l'intérieur -->
    <line x1="12" y1="28" x2="45" y2="28" stroke="#d9d9d9" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="46" x2="52" y2="46" stroke="#f09a27" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="64" x2="38" y2="64" stroke="#d9d9d9" stroke-width="5" stroke-linecap="round"/>

    <!-- Flèche de parsing / transformation au centre -->
    <g transform="translate(75, 30)">
      <path d="M 0 15 L 35 15" stroke="#f09a27" stroke-width="7" stroke-linecap="round"/>
      <polygon points="30,5 50,15 30,25" fill="#f09a27"/>
    </g>

    <!-- Bloc de droite : Données analysées / parsées (Structure propre / Don validé) -->
    <rect x="135" y="10" width="75" height="85" rx="8" fill="#f09a27" stroke="#cc8120" stroke-width="3"/>
    <!-- Icône engrenage / tableau structuré à l'intérieur du bloc parsé -->
    <circle cx="172.5" cy="52" r="22" fill="#ffffff"/>
    <!-- Lignes de données structurées -->
    <line x1="155" y1="33" x2="190" y2="33" stroke="#f09a27" stroke-width="4" stroke-linecap="round"/>
    <line x1="155" y1="71" x2="190" y2="71" stroke="#f09a27" stroke-width="4" stroke-linecap="round"/>
    <!-- Petit symbole check/extraction au centre -->
    <path d="M 164 52 L 170 58 L 182 44" fill="none" stroke="#f09a27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>


























  <!-- Texte DEDOUM en bas (reprend exactement le modèle de l'horloge : taille 54, police très grasse, position Y 442) -->
  <text x="256" y="442" 
        text-anchor="middle" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="54" 
        letter-spacing="4" 
        fill="#333333">DEDOUM</text>
</svg>
